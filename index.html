<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Identidade visual unificada: mesma logo no cabeçalho, aba e PWA. -->
    <link rel="icon" type="image/png" href="/logo.png?v=brand-823" />
    <link rel="shortcut icon" type="image/png" href="/logo.png?v=brand-823" />
    <link rel="apple-touch-icon" href="/logo.png?v=brand-823" />
    <link rel="manifest" href="/manifest.json?v=brand-823" />
    <meta name="theme-color" content="#ff6101" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplica PLUS | IEAD - JOTA</title>
    <meta name="description" content="Aplicativo moderno e inteligente para acompanhamento de membros, controle de presença e relatórios pastorais da igreja." />
    <link rel="stylesheet" href="/src/styles/member-edit-footer-v823.css" />
    <script type="module" crossorigin src="/src/main.tsx"></script>
    <script type="module" src="/src/preloadAppViews.ts"></script>
    <script type="module" src="/src/mobileUxEnhancements.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isLocalPreview = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if ('serviceWorker' in navigator && !isLocalPreview) {
        // v8.2.3: força a atualização do cache visual/PWA desta versão.
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=823-brand')
            .then(reg => {
              console.log('[SW v8.2.3] registrado', reg.scope);
              reg.update().catch(() => {});
            })
            .catch(err => console.error('[SW v8.2.3] falha no registro:', err));
        });
      } else if ('serviceWorker' in navigator && isLocalPreview) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
      }
    </script>
  </body>
</html>
