<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Identidade visual unificada: mesma logo no cabeçalho, aba e PWA. -->
    <link rel="icon" type="image/png" href="/logo.png?v=brand-822" />
    <link rel="shortcut icon" type="image/png" href="/logo.png?v=brand-822" />
    <link rel="apple-touch-icon" href="/logo.png?v=brand-822" />
    <link rel="manifest" href="/manifest.json?v=brand-822" />
    <meta name="theme-color" content="#ff6101" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplica PLUS | IEAD - JOTA</title>
    <meta name="description" content="Aplicativo moderno e inteligente para acompanhamento de membros, controle de presença e relatórios pastorais da igreja." />
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isLocalPreview = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if ('serviceWorker' in navigator && !isLocalPreview) {
        // v8.2.2: força a atualização somente do cache visual/PWA.
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=822-brand')
            .then(reg => {
              console.log('[SW v8.2.2] registrado', reg.scope);
              reg.update().catch(() => {});
            })
            .catch(err => console.error('[SW v8.2.2] falha no registro:', err));
        });
      } else if ('serviceWorker' in navigator && isLocalPreview) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
      }
    </script>
  </body>
</html>
