<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2336d8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplica PLUS - Templo JK</title>
    <meta name="description" content="Aplicativo moderno e inteligente para acompanhamento de membros, controle de presença e relatórios pastorais da igreja." />
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isLocalPreview = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if ('serviceWorker' in navigator && !isLocalPreview) {
        // v8.0.0: registra/atualiza o SW sem forçar reload no controllerchange.
        // O ciclo de versão do próprio app é o único responsável por atualizar a página.
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=800-cloud')
            .then(reg => {
              console.log('[SW v8.0.0] registrado', reg.scope);
              // Verifica atualização em segundo plano, mas não recarrega a página aqui.
              reg.update().catch(() => {});
            })
            .catch(err => console.error('[SW v8.0.0] falha no registro:', err));
        });
      } else if ('serviceWorker' in navigator && isLocalPreview) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
      }
    </script>
  </body>
</html>
